name: CI

# Fast in-process unit suite on every push/PR; the slow cross-process
# integration suite only on a nightly schedule, manual dispatch, or a PR label —
# never on the push hot-path.
on:
  push:
    branches: [main]
  pull_request:
    # Include `labeled` so adding the run-integration label fires a fresh run that
    # the gated integration job can see — without it, the label gates a job the
    # workflow never re-triggers to evaluate.
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# Least privilege: the test pipeline only reads the repo. No write token, no
# secrets — a compromised step cannot push, tag, or alter releases.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast unit suite
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # A wedged job has to fail while someone is still watching it. With no bound
    # the ceiling is GitHub's 6-hour default, which a hang burns in silence.
    timeout-minutes: 30
    env:
      # ASDF finds the project at the checkout root; dependencies resolve from
      # the Quicklisp dist (every dep is in the dist — no local checkouts needed).
      CL_SOURCE_REGISTRY: '${{ github.workspace }}//:'
    steps:
      - uses: actions/checkout@v4

      - name: Install libzmq
        # The coordination bus links libzmq through pzmq, so the C library and its
        # headers must be present for the grovel step. pzmq itself is in the
        # Quicklisp dist; only the native library needs installing here.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libzmq3-dev

      - name: Install pinned SBCL (sbcl-bin via Roswell)
        # Pin the exact sbcl-bin version so the GC flavor is deterministic
        # (this sbcl-bin ships the MARK-REGION collector) — a fixed flavor is
        # what makes the flavor-keyed fasl cache safe to restore across runs.
        run: |
          set -euo pipefail
          ROSWELL_VERSION=v23.10.14.114
          curl -fsSL "https://github.com/roswell/roswell/releases/download/${ROSWELL_VERSION}/roswell_${ROSWELL_VERSION#v}-1_amd64.deb" -o ros.deb
          sudo dpkg -i ros.deb
          ros install sbcl-bin/2.5.5
          ros use sbcl-bin/2.5.5
          # The roswell bin dir only carries `ros`, not a bare `sbcl` shim, so
          # symlink the installed sbcl-bin binary onto PATH for later steps
          # (make test / quicklisp install invoke `sbcl` directly).
          SBCL_BIN="$(find "$HOME/.roswell/impls" -type f -name sbcl -path '*sbcl-bin*' | head -1)"
          test -n "$SBCL_BIN" || { echo "sbcl-bin binary not found under ~/.roswell/impls" >&2; exit 1; }
          sudo ln -sf "$SBCL_BIN" /usr/local/bin/sbcl
          sbcl --version

      - name: Install Quicklisp
        run: |
          set -euo pipefail
          # Pin a recent ASDF: the bundled sbcl-bin ASDF is too old to parse
          # :local-nicknames in package-inferred-system dependency analysis,
          # which this project's defpackages use. Load it ahead of Quicklisp.
          curl -fsSL https://asdf.common-lisp.dev/archives/asdf-3.3.7.lisp -o "$HOME/asdf.lisp"
          curl -fsSL -O https://beta.quicklisp.org/quicklisp.lisp
          sbcl --non-interactive --load "$HOME/asdf.lisp" --load quicklisp.lisp \
               --eval '(quicklisp-quickstart:install)'
          # Make every subsequent bare `sbcl` (the `make test` recipe included)
          # load the pinned ASDF, then Quicklisp, so ASDF resolves the test
          # dependencies (jzon, log4cl, …) from the dist on demand.
          {
            printf '%s\n' '(let ((a (merge-pathnames "asdf.lisp" (user-homedir-pathname)))) (when (probe-file a) (load a)))'
            printf '%s\n' '#-quicklisp (let ((q (merge-pathnames "quicklisp/setup.lisp" (user-homedir-pathname)))) (when (probe-file q) (load q)))'
          } >> "$HOME/.sbclrc"
          sbcl --non-interactive --eval '(format t "asdf=~A quicklisp=~A~%" (asdf:asdf-version) (and (find-package :ql) t))'

      - name: Resolve SBCL fingerprint
        id: lisp
        # version + GC flavor: a flavor or version change must invalidate the
        # fasl cache (a clean recompile), never load a mismatched fasl.
        run: |
          set -euo pipefail
          RAW=$(sbcl --noinform --no-sysinit --no-userinit --non-interactive --eval \
            '(progn (format t "~a-~a~%" (lisp-implementation-version) (cond ((member :mark-region-gc *features*) "mark-region") ((member :gencgc *features*) "gencgc") (t "UNKNOWN"))) (sb-ext:exit))')
          FP=$(printf '%s\n' "$RAW" | tail -n1)
          case "$FP" in *-UNKNOWN) echo "unrecognized GC flavor: $FP" >&2; exit 1;; esac
          echo "fp=$FP" >> "$GITHUB_OUTPUT"
          echo "SBCL fingerprint: $FP"

      - name: Cache compiled fasls
        uses: actions/cache@v4
        with:
          # Cache the same project-local dir `make test` writes to (the Makefile
          # exports XDG_CACHE_HOME=$(CURDIR)/.ci-cache), and the prime step below
          # exports the same dir — so the warm `make test` run actually reloads
          # primed fasls. Keying on the GC fingerprint keeps a flavor change from
          # ever loading a mismatched fasl.
          path: .ci-cache/common-lisp
          key: cl-fasl-${{ runner.os }}-${{ steps.lisp.outputs.fp }}-${{ hashFiles('**/*.asd') }}
          restore-keys: |
            cl-fasl-${{ runner.os }}-${{ steps.lisp.outputs.fp }}-

      - name: Vendor slynk-client (not in the Quicklisp dist)
        # slynk-client is sourced from a fork branch, not the QL dist. Clone it,
        # pinned to the exact commit, into a non-hidden dir the recursive
        # CL_SOURCE_REGISTRY scans, so ASDF resolves it locally while every other
        # dependency comes from the dist.
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/fade/slynk-client.git vendor/slynk-client
          git -C vendor/slynk-client checkout 67b65da7210b4f9a6e373077373528a4c7bed4b5

      - name: Vendor zebra (not in the Quicklisp dist)
        # The test framework is not in the dist and the repository is private,
        # so this clone needs a credential with read access to it. Without one
        # the step fails here rather than later, where an unresolvable framework
        # would instead look like a suite that ran and found nothing.
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/fade/zebra.git vendor/zebra
          git -C vendor/zebra checkout 941ab4d294066ebdb7c2d1bd11d94d245f1d5aa2

      - name: Prime dependencies (cold — download dist deps + compile)
        # `make test` uses asdf:load-system, which resolves only systems already
        # on disk; it does not download from the dist. ql:quickload does the
        # download + compile once, populating the fasl cache. Export the same
        # project-local XDG_CACHE_HOME the Makefile uses so the primed fasls land
        # in the cached dir and the warm `make test` run reloads them instead of
        # recompiling from cold.
        run: |
          set -euo pipefail
          export XDG_CACHE_HOME="$PWD/.ci-cache"
          /usr/bin/time -v sbcl --non-interactive \
            --eval '(ql:quickload "dsmr-mcp/tests" :verbose nil)' 2> cold.time \
            || { cat cold.time; exit 1; }
          grep -E 'Elapsed \(wall' cold.time || true

      - name: Fast suite (warm)
        # The same `make test` a contributor runs. Deps are now compiled into the
        # shared .ci-cache, so this is the warm fast-suite number.
        run: |
          set -euo pipefail
          /usr/bin/time -v make test 2> warm.time || { cat warm.time; exit 1; }
          grep -E 'Elapsed \(wall' warm.time || true

  integration:
    name: Cross-process integration suite (gated)
    # Off the push hot-path: nightly, manual dispatch, or a PR carrying the
    # run-integration label only.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-integration')
    runs-on: ubuntu-latest
    # The suite takes about 13 minutes on a development machine. This bounds a
    # wedged run well clear of that, so a hang is reported as a failure in the
    # hour it happens instead of quietly consuming a whole job budget.
    timeout-minutes: 60
    env:
      CL_SOURCE_REGISTRY: '${{ github.workspace }}//:'
    steps:
      - uses: actions/checkout@v4

      - name: Install libzmq
        # The bus integration tests spawn brokers that link libzmq via pzmq.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libzmq3-dev

      - name: Install pinned SBCL (sbcl-bin via Roswell)
        run: |
          set -euo pipefail
          ROSWELL_VERSION=v23.10.14.114
          curl -fsSL "https://github.com/roswell/roswell/releases/download/${ROSWELL_VERSION}/roswell_${ROSWELL_VERSION#v}-1_amd64.deb" -o ros.deb
          sudo dpkg -i ros.deb
          ros install sbcl-bin/2.5.5
          ros use sbcl-bin/2.5.5
          # The roswell bin dir only carries `ros`, not a bare `sbcl` shim, so
          # symlink the installed sbcl-bin binary onto PATH for later steps
          # (make test / quicklisp install invoke `sbcl` directly).
          SBCL_BIN="$(find "$HOME/.roswell/impls" -type f -name sbcl -path '*sbcl-bin*' | head -1)"
          test -n "$SBCL_BIN" || { echo "sbcl-bin binary not found under ~/.roswell/impls" >&2; exit 1; }
          sudo ln -sf "$SBCL_BIN" /usr/local/bin/sbcl
          sbcl --version

      - name: Install Quicklisp
        run: |
          set -euo pipefail
          # Pin a recent ASDF: the bundled sbcl-bin ASDF is too old to parse
          # :local-nicknames in package-inferred-system dependency analysis,
          # which this project's defpackages use. Load it ahead of Quicklisp.
          curl -fsSL https://asdf.common-lisp.dev/archives/asdf-3.3.7.lisp -o "$HOME/asdf.lisp"
          curl -fsSL -O https://beta.quicklisp.org/quicklisp.lisp
          sbcl --non-interactive --load "$HOME/asdf.lisp" --load quicklisp.lisp \
               --eval '(quicklisp-quickstart:install)'
          # Make every subsequent bare `sbcl` (the `make test` recipe included)
          # load the pinned ASDF, then Quicklisp, so ASDF resolves the test
          # dependencies (jzon, log4cl, …) from the dist on demand.
          {
            printf '%s\n' '(let ((a (merge-pathnames "asdf.lisp" (user-homedir-pathname)))) (when (probe-file a) (load a)))'
            printf '%s\n' '#-quicklisp (let ((q (merge-pathnames "quicklisp/setup.lisp" (user-homedir-pathname)))) (when (probe-file q) (load q)))'
          } >> "$HOME/.sbclrc"
          sbcl --non-interactive --eval '(format t "asdf=~A quicklisp=~A~%" (asdf:asdf-version) (and (find-package :ql) t))'

      - name: Resolve SBCL fingerprint
        id: lisp
        run: |
          set -euo pipefail
          RAW=$(sbcl --noinform --no-sysinit --no-userinit --non-interactive --eval \
            '(progn (format t "~a-~a~%" (lisp-implementation-version) (cond ((member :mark-region-gc *features*) "mark-region") ((member :gencgc *features*) "gencgc") (t "UNKNOWN"))) (sb-ext:exit))')
          FP=$(printf '%s\n' "$RAW" | tail -n1)
          case "$FP" in *-UNKNOWN) echo "unrecognized GC flavor: $FP" >&2; exit 1;; esac
          echo "fp=$FP" >> "$GITHUB_OUTPUT"

      - name: Cache compiled fasls
        uses: actions/cache@v4
        with:
          # Cache the same project-local dir `make test-integration` writes to
          # (the Makefile exports XDG_CACHE_HOME=$(CURDIR)/.ci-cache), and the
          # prime step below exports the same dir, so the gated suite reloads
          # primed fasls. Keyed on the GC fingerprint against a flavor mismatch.
          path: .ci-cache/common-lisp
          key: cl-fasl-${{ runner.os }}-${{ steps.lisp.outputs.fp }}-${{ hashFiles('**/*.asd') }}
          restore-keys: |
            cl-fasl-${{ runner.os }}-${{ steps.lisp.outputs.fp }}-

      - name: Vendor slynk-client (not in the Quicklisp dist)
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/fade/slynk-client.git vendor/slynk-client
          git -C vendor/slynk-client checkout 67b65da7210b4f9a6e373077373528a4c7bed4b5

      - name: Vendor zebra (not in the Quicklisp dist)
        # Private repository; this clone needs a credential with read access.
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/fade/zebra.git vendor/zebra
          git -C vendor/zebra checkout 941ab4d294066ebdb7c2d1bd11d94d245f1d5aa2

      - name: Prime dependencies (download dist deps + compile)
        # Export the same project-local XDG_CACHE_HOME the Makefile uses so the
        # primed fasls land in the cached dir that `make test-integration` reads.
        run: |
          set -euo pipefail
          export XDG_CACHE_HOME="$PWD/.ci-cache"
          sbcl --non-interactive \
            --eval '(ql:quickload "dsmr-mcp/tests/integration" :verbose nil)'

      - name: Integration suite
        # sbcl is on PATH (installed above), so the gated leaves actually spawn
        # their child SBCLs and run — they do not all-skip.
        run: make test-integration
